[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "site-django-kit"
version = "1.0.0"
description = "Reusable Django public website and fixed-block CMS kit matching django-design-studio, list-django-kit, cal-django-kit and domain-django-kit."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Django>=4.2",
]

[tool.setuptools.packages.find]
include = ["site_kit*"]

[tool.setuptools.package-data]
site_kit = [
    "templates/**/*",
    "static/**/*",
]
